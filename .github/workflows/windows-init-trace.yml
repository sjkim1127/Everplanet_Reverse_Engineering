name: Windows client init trace

on:
  pull_request:
    paths:
      - 'EverPlanet/**'
      - 'frida/**'
      - 'scripts/**'
      - '.github/workflows/windows-init-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init-trace:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trace payload
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EverPlanet
            frida
            scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Install Frida
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet frida-tools
          python -c "import frida; print('frida-python', frida.__version__)"

      - name: Trace early initialization
        id: trace
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:RUNNER_TEMP 'init-trace'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null

          $exe = Join-Path $PWD 'EverPlanet\EverPlanet_KR_v1842_U_DEVM.exe'
          $probe = Join-Path $PWD 'scripts\ci_frida_spawn_probe.py'
          $forceLogin = Join-Path $PWD 'frida\hook_force_login.js'
          $headless = Join-Path $PWD 'frida\hook_ci_headless.js'
          $initTrace = Join-Path $PWD 'frida\ci_init_trace.js'
          $stdout = Join-Path $diag 'init-trace-stdout.txt'
          $stderr = Join-Path $diag 'init-trace-stderr.txt'

          & python $probe --exe $exe --script $forceLogin --script $headless --script $initTrace --duration 30 1> $stdout 2> $stderr
          $probeExit = $LASTEXITCODE
          "probe_exit=$probeExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host '--- init trace highlights ---'
          if (Test-Path $stdout) {
            Select-String -Path $stdout -Pattern 'INIT_TRACE|nmcogame|MessageBox|ExitProcess|TerminateProcess|LoadLibrary|LdrLoadDll|CreateFile' |
              ForEach-Object { $_.Line }
          }
          Write-Host '--- stderr ---'
          if (Test-Path $stderr) { Get-Content $stderr }

          $scriptLoaded = $false
          $nmcoMention = $false
          $nmcoLoaded = $false
          $messageBoxSeen = $false
          $exitSeen = $false
          if (Test-Path $stdout) {
            $scriptLoaded = [bool](Select-String -Path $stdout -Pattern '\[INIT_TRACE\] script_loaded' -Quiet)
            $nmcoMention = [bool](Select-String -Path $stdout -Pattern 'nmcogame' -Quiet)
            $nmcoLoaded = [bool](Select-String -Path $stdout -Pattern 'nmcogame_loaded=true' -Quiet)
            $messageBoxSeen = [bool](Select-String -Path $stdout -Pattern '\[INIT_TRACE\] MessageBox' -Quiet)
            $exitSeen = [bool](Select-String -Path $stdout -Pattern '\[INIT_TRACE\] (ExitProcess|TerminateProcess)' -Quiet)
          }

          "script_loaded=$($scriptLoaded.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nmco_mention=$($nmcoMention.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nmco_loaded=$($nmcoLoaded.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "messagebox_seen=$($messageBoxSeen.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exit_seen=$($exitSeen.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload init trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-init-trace
          path: ${{ runner.temp }}/init-trace
          if-no-files-found: warn
          retention-days: 7

      - name: Report init trace
        if: always()
        shell: pwsh
        run: |
          Write-Host "Probe exit:      ${{ steps.trace.outputs.probe_exit }}"
          Write-Host "Trace loaded:    ${{ steps.trace.outputs.script_loaded }}"
          Write-Host "NMCO mentioned:  ${{ steps.trace.outputs.nmco_mention }}"
          Write-Host "NMCO loaded:     ${{ steps.trace.outputs.nmco_loaded }}"
          Write-Host "MessageBox seen: ${{ steps.trace.outputs.messagebox_seen }}"
          Write-Host "Exit seen:       ${{ steps.trace.outputs.exit_seen }}"
