name: Windows client CDB trace

on:
  push:
    branches:
      - main
    paths:
      - 'EverPlanet/**'
      - 'scripts/ci_cdb_trace.txt'
      - 'scripts/ci_cdb_watchpoints.txt'
      - '.github/workflows/windows-cdb-trace.yml'
  pull_request:
    paths:
      - 'EverPlanet/**'
      - 'scripts/ci_cdb_trace.txt'
      - 'scripts/ci_cdb_watchpoints.txt'
      - '.github/workflows/windows-cdb-trace.yml'
  workflow_dispatch:

concurrency:
  group: everplanet-cdb-trace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdb-trace:
    runs-on: windows-latest
    timeout-minutes: 6

    steps:
      - name: Checkout client and trace scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EverPlanet
            scripts/ci_cdb_trace.txt
            scripts/ci_cdb_watchpoints.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Locate CDB
        id: cdb
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x86\cdb.exe'
          )
          $cdb = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { throw 'x86 cdb.exe is not installed on this runner.' }
          Write-Host "CDB: $cdb"
          "path=$cdb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Trace NMCO and Winsock connect
        id: trace
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:RUNNER_TEMP 'cdb-trace'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $exe = Join-Path $PWD 'EverPlanet\EverPlanet_KR_v1842_U_DEVM.exe'
          $commands = Join-Path $PWD 'scripts\ci_cdb_trace.txt'
          $log = Join-Path $diag 'cdb.txt'
          $cdb = '${{ steps.cdb.outputs.path }}'

          try {
            & $cdb -G -o -logo $log -cf $commands $exe
            $exit = $LASTEXITCODE
          } finally {
            Get-Process EverPlanet_KR_v1842_U_DEVM -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process cdb -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          "cdb_exit=$exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $nmco = $false
          $nmconew = $false
          $winsock = $false
          $connects = 0
          if (Test-Path $log) {
            $nmco = [bool](Select-String -Path $log -SimpleMatch '[CDB_TRACE] nmcogame_loaded' -Quiet)
            $nmconew = [bool](Select-String -Path $log -SimpleMatch '[CDB_TRACE] nmconew_loaded' -Quiet)
            $winsock = [bool](Select-String -Path $log -SimpleMatch 'ws2_32.dll' -Quiet)
            $connects = @(Select-String -Path $log -SimpleMatch '[CDB_TRACE] connect_enter').Count
            Select-String -Path $log -Pattern 'CDB_TRACE|ModLoad|sockaddr=|exception|ERROR|WARNING|Command file' |
              Select-Object -First 400 | ForEach-Object { $_.Line }
          }

          "nmcogame_loaded=$($nmco.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nmconew_loaded=$($nmconew.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "winsock_loaded=$($winsock.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "connect_count=$connects" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload CDB trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-cdb-trace
          path: ${{ runner.temp }}/cdb-trace
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "CDB exit:      ${{ steps.trace.outputs.cdb_exit }}"
          Write-Host "nmcogame:      ${{ steps.trace.outputs.nmcogame_loaded }}"
          Write-Host "nmconew:       ${{ steps.trace.outputs.nmconew_loaded }}"
          Write-Host "ws2_32:        ${{ steps.trace.outputs.winsock_loaded }}"
          Write-Host "connect calls: ${{ steps.trace.outputs.connect_count }}"
