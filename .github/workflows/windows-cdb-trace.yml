name: Windows client CDB trace

on:
  pull_request:
    paths:
      - 'EverPlanet/**'
      - '.github/workflows/windows-cdb-trace.yml'
  workflow_dispatch:

concurrency:
  group: everplanet-cdb-trace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdb-trace:
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EverPlanet
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Locate or install CDB
        id: cdb
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x86\cdb.exe'
          )
          $cdb = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) {
            Write-Host 'CDB not preinstalled; installing Windows SDK Debugging Tools via winget.'
            winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $cdb = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $cdb) { throw 'x86 cdb.exe was not found after SDK installation attempt.' }
          Write-Host "CDB: $cdb"
          "path=$cdb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Trace client headlessly with CDB
        id: trace
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:RUNNER_TEMP 'cdb-trace'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $exe = Join-Path $PWD 'EverPlanet\EverPlanet_KR_v1842_U_DEVM.exe'
          $log = Join-Path $diag 'cdb.txt'
          $cdb = '${{ steps.cdb.outputs.path }}'

          # -g ignores the initial breakpoint. -G ignores the final breakpoint.
          # sxe ld:nmcogame breaks if the legacy NMCO module is loaded.
          # sxe epr breaks when the debuggee exits so the final stack/modules can be logged.
          # The .sleep/q sequence bounds this first experiment even if the client remains alive.
          $commands = '.logopen /t "' + $log + '"; .symfix; sxe ld:nmcogame; sxe epr; g; .sleep 30000; ~* k; lm; .logclose; q'
          Write-Host "Launching CDB against: $exe"
          & $cdb -g -G -o -logo $log -c $commands $exe
          $exit = $LASTEXITCODE
          "cdb_exit=$exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Process EverPlanet_KR_v1842_U_DEVM -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Write-Host '--- CDB highlights ---'
          if (Test-Path $log) {
            Select-String -Path $log -Pattern 'nmcogame|ModLoad|exit|exception|EverPlanet|WARNING|ERROR' | Select-Object -First 250 | ForEach-Object { $_.Line }
          }

      - name: Upload CDB trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-cdb-trace
          path: ${{ runner.temp }}/cdb-trace
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "CDB exit: ${{ steps.trace.outputs.cdb_exit }}"
